<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Network Monitor</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#131b30; --muted:#91a0ba; --line:#25304a; --accent:#62d6b4; --danger:#ff8b8b; }
    * { box-sizing:border-box } body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:#eef4ff }
    main { width:min(1120px, calc(100% - 32px)); margin:48px auto }
    header,.toolbar { display:flex; align-items:end; justify-content:space-between; gap:20px; flex-wrap:wrap }
    h1 { margin:0; font-size:clamp(28px,5vw,44px); letter-spacing:-.04em } h2 { margin:0; font-size:20px }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:12px; font-weight:700 }
    .muted,.meta { color:var(--muted) } .panel { margin-top:28px; padding:22px; background:var(--panel); border:1px solid var(--line); border-radius:16px }
    select,button { min-height:42px; border-radius:9px; border:1px solid var(--line); padding:0 14px; font:inherit }
    select { color:#eef4ff; background:#0e1629; min-width:280px } button { color:#07120f; background:var(--accent); border:0; font-weight:700; cursor:pointer }
    button:disabled { opacity:.55; cursor:wait } .error { color:var(--danger); margin:16px 0 0 }
    .detail { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--muted); cursor:pointer }.detail input{accent-color:var(--accent)}
    .table-wrap { overflow:auto; margin-top:18px } table { width:100%; border-collapse:collapse; min-width:1100px }
    th,td { padding:13px 10px; border-bottom:1px solid var(--line); text-align:left } th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em }
    .tag { display:inline-block; padding:3px 8px; border-radius:20px; background:#1f3a38; color:var(--accent); font-size:12px }.sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}.services{max-width:220px}
    .empty { padding:40px 0; text-align:center; color:var(--muted) }
    @media(max-width:600px) { main{margin:26px auto}.panel{padding:16px} select{min-width:100%;width:100%}.toolbar>div{width:100%}button{width:100%;margin-top:8px} }
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Local discovery</div><h1>Home Network Monitor</h1><p class="muted">Discover devices and identify their make, model, services, and likely operating system.</p></div><div id="health" class="meta">Connecting…</div></header>
  <section class="panel">
    <div class="toolbar"><div><label for="interface">Network interface</label><br><select id="interface" aria-label="Network interface"></select><label class="detail"><input id="details" type="checkbox" checked> Detailed identification (slower)</label></div><button id="scan">Scan network</button></div>
    <p id="error" class="error" role="alert" hidden></p>
  </section>
  <section class="panel"><div class="toolbar"><h2>Discovered devices</h2><div id="summary" class="meta">No scan yet</div></div><div class="table-wrap"><table>
    <thead><tr><th>Device</th><th>IP address</th><th>MAC address</th><th>Make / model</th><th>Likely OS</th><th>Type</th><th>Services</th></tr></thead><tbody id="devices"><tr><td colspan="7" class="empty">Choose an interface and start a scan.</td></tr></tbody>
  </table></div></section>
</main><script>
const select=document.querySelector('#interface'), details=document.querySelector('#details'), button=document.querySelector('#scan'), body=document.querySelector('#devices'), error=document.querySelector('#error'), summary=document.querySelector('#summary');
const escapeHtml=value => String(value ?? '—').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const safe=value => escapeHtml(value || '—');
async function json(url, options) { const response=await fetch(url,options); const data=await response.json(); if(!response.ok) throw new Error(data.error||`Request failed (${response.status})`); return data }
async function load() { try { const [health,interfaces]=await Promise.all([json('/api/health'),json('/api/interfaces')]); document.querySelector('#health').textContent=health.persistence?'Ready · nicknames enabled':'Ready · scan only'; select.replaceChildren(...interfaces.map(i=>{const option=document.createElement('option');option.value=i.id||i.name;option.textContent=`${i.name} · ${i.network}${i.is_default?' (default)':''}`;return option})); if(!interfaces.length){button.disabled=true;throw new Error('No usable IPv4 network interface was found.')} } catch(e){showError(e.message)} }
function showError(message){error.textContent=message;error.hidden=false}
button.addEventListener('click',async()=>{ error.hidden=true;button.disabled=true;button.textContent=details.checked?'Identifying…':'Scanning…';body.innerHTML='<tr><td colspan="7" class="empty">Scanning the selected network…</td></tr>'; try { const result=await json('/api/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interface:select.value,details:details.checked})}); summary.textContent=`${result.count} device${result.count===1?'':'s'} · ${result.duration_seconds}s${result.details?' · detailed':''}`; body.innerHTML=result.devices.map(d=>{const name=d.nickname||d.friendly_name||d.hostname;const model=[d.vendor,d.model].filter(Boolean).join(' · ');const os=d.operating_system?`${d.operating_system}${d.os_confidence?` (${d.os_confidence})`:''}`:null;const mac=d.mac_is_randomized?`${safe(d.mac_address)}<span class="sub">Private/randomized</span>`:safe(d.mac_address);const services=(d.services||[]).map(s=>`${safe(s.name)}:${safe(s.port)}`).join(', ');return `<tr><td>${safe(name)}</td><td>${safe(d.ip_address)}</td><td>${mac}</td><td>${safe(model)}</td><td>${safe(os)}</td><td><span class="tag">${safe(d.device_type)}</span></td><td class="services">${services||'—'}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No devices responded.</td></tr>'; } catch(e){showError(e.message);body.innerHTML='<tr><td colspan="7" class="empty">Scan failed.</td></tr>'} finally {button.disabled=false;button.textContent='Scan network'} }); load();
</script></body></html>
