services:
  netscan:
    build: .
    network_mode: host
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      NETSCAN_MAX_HOSTS: 1024
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netscan-data:/data
    restart: unless-stopped
volumes:
  netscan-data:
